; PlatformIO Project Configuration
; AudioMultiRoom - ESP32 Bluetooth Speaker + ESP-NOW Mesh
; Hardware: ESP32 DevKit + PCM5102 DAC + TPA3116 Amp

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192

; Library dependencies
lib_deps =
    ; https://github.com/pschatzmann/arduino-audio-tools.git  ; COMMENTED OUT - ESP-NOW disabled
    https://github.com/pschatzmann/ESP32-A2DP.git
    ; https://github.com/pschatzmann/arduino-libsbc.git       ; COMMENTED OUT - SBC disabled

; Partition scheme with more app space
board_build.partitions = huge_app.csv

; Upload settings
upload_port = COM7
upload_speed = 921600
