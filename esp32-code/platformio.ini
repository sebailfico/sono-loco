; PlatformIO Project Configuration
; SonoLoco - Unified multi-room audio firmware
; Hardware: ESP32 + PCM5102 DAC + TPA3116 Amp
;
; There are only TWO builds here, because there are only two instruction sets:
;
;   esp32_classic — every BT Classic ESP32 module (WROOM and WROVER alike)
;   esp32s3       — Xtensa ESP32-S3, no BT Classic, must be its own build
;
; WROOM and WROVER share one binary on purpose. The Arduino core ships with
; CONFIG_SPIRAM=y and CONFIG_SPIRAM_BOOT_INIT unset, so psramInit() probes for
; PSRAM at runtime and merely logs a warning when there is none. That means the
; same image boots on both, and setupESPNow() decides at runtime what the node
; can do — which is the whole premise of the project:
;
;   WROVER (PSRAM present) → WiFi comes up  → SERVER or CLIENT
;   WROOM  (no PSRAM)      → WiFi skipped   → local BT playback, no mesh
;
; The esp32dev / esp32wrover environments below are therefore the SAME build,
; kept as separate names only so each board keeps its own COM port.

[common]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = huge_app.csv
upload_speed = 921600
; Defines FW_VERSION from `git describe`, so every board can report the commit
; it was built from and a bench log can be tied back to a tree state. There is
; deliberately no version constant to bump by hand. See D10.
extra_scripts = pre:scripts/version.py
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384

; ─── Build 1: BT Classic ESP32 (WROOM + WROVER) ──────────────────────────────
; board = esp32dev is the generic module definition and is correct for both;
; esp-wrover-kit describes Espressif's dev board, not a bare WROVER module.
[esp32_classic]
extends = common
platform = espressif32
board = esp32dev
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git
build_flags =
    ${common.build_flags}
    -DENABLE_BLUETOOTH=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; ─── Build 2: ESP32-S3 — CLIENT only ─────────────────────────────────────────
; No -DENABLE_BLUETOOTH: the S3 has no BT Classic, so it is always a CLIENT.
; No A2DP library either — it would not compile for this target.
;
; If the S3 module has PSRAM (e.g. N16R8), add the memory type below. Do NOT add
; a second build_flags key to an environment: duplicate keys in one INI section
; are a hard DuplicateOptionError and the whole project stops loading.
;   board_build.arduino.memory_type = qio_opi
;
; ARDUINO_USB_CDC_ON_BOOT is required, not cosmetic. The board definition sets
; ARDUINO_USB_MODE=1 but leaves CDC_ON_BOOT unset, which routes `Serial` to UART0
; on GPIO43/44 — not to the native USB port the board actually enumerates on
; (VID 303A). Without this flag the S3 is completely silent over USB and the
; bench harness cannot see it. Side effect worth knowing: with CDC on boot the
; port re-enumerates across ESP.restart(), so hosts must reopen it.
[esp32s3_client]
extends = common
platform = espressif32
board = esp32-s3-devkitc-1
lib_deps =
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; ─── Build 3: ESP32-C3 — CLIENT only ─────────────────────────────────────────
; A third build, for the same reason the S3 has a second one: a third
; instruction set. The C3 is RISC-V, so it cannot share an image with either
; Xtensa build no matter how the roles are negotiated at runtime. That is the
; criterion in D4 — different behaviour is detected at runtime, different silicon
; is not negotiable.
;
; It can only ever be a CLIENT: no BT Classic, so no A2DP, and no PSRAM support
; at all. What it is useful for is being a *second* client -- a third clock in
; the mesh, with its own crystal offset, which is what turns "drift correction
; works on this pair of boards" into "drift correction adapts". See D11.
;
; ARDUINO_USB_CDC_ON_BOOT for the same reason as the S3: this board enumerates
; on native USB (USB Serial/JTAG), and without it `Serial` goes to UART0 on
; GPIO20/21 and the board is silent to the bench harness.
;
; ARDUINO_USB_MODE=1 is required alongside it here, unlike on the S3 whose board
; definition already sets it. The C3 has no USB-OTG peripheral, only USB
; Serial/JTAG, and the Arduino core selects between them on this macro: left
; undefined it compiles the OTG path, and `Serial` then does not exist at all —
; hundreds of "'Serial' was not declared in this scope" out of config.h.
[esp32c3_client]
extends = common
platform = espressif32
board = esp32-c3-devkitm-1
lib_deps =
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ─── Build 4: host ───────────────────────────────────────────────────────────
; `pio test -e native` runs test/test_jitter on this PC, no board required.
; It covers lib/jitter — the ring buffer and the packet sequence accounting —
; which is pure logic and is where every hard-to-see audio bug has come from.
;
; test_build_src stays off (the default): src/main.cpp is full of ESP-IDF and
; cannot compile here, and it does not need to. The library under test is picked
; up from lib/ by the dependency finder.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

; ─── Nodes: name + port only, no build config ────────────────────────────────
; Ports confirmed 2026-08-19 with `pio device list` and `esptool chip_id`:
;   COM8  ESP32-D0WD-V3, no PSRAM  -> WROOM
;   COM9  ESP32-S3, 8 MB PSRAM, enumerates on native USB (VID 303A)
; No WROVER is attached yet, so esp32wrover's port is still a placeholder.
; tools/bench-mesh.ps1 does not rely on any of this — it discovers ports and
; identifies each chip at run time, so a new board needs no edit here.
;
; ROOM_NAME lives here rather than in config.h so the source tree is identical
; for every node: you flash a different environment, not a different file. It is
; also the Bluetooth name, so giving each node its own makes the mesh pickable
; from a phone instead of showing three identical entries.
;
; NOTE the ${...} reference: a bare `build_flags` key here would REPLACE the
; parent's flags, silently dropping -DENABLE_BLUETOOTH. Always extend.

[env:esp32dev]
extends = esp32_classic
build_flags =
    ${esp32_classic.build_flags}
    -DROOM_NAME='"SonoLoco-WROOM"'
upload_port = COM8
monitor_port = COM8

[env:esp32wrover]
extends = esp32_classic
build_flags =
    ${esp32_classic.build_flags}
    -DROOM_NAME='"SonoLoco-WROVER"'
upload_port = COM7
monitor_port = COM7

[env:esp32s3]
extends = esp32s3_client
build_flags =
    ${esp32s3_client.build_flags}
    -DROOM_NAME='"SonoLoco-S3"'
upload_port = COM9
monitor_port = COM9

; No C3 has been attached yet, so this port is a placeholder like the WROVER's.
; The bench harness discovers and identifies boards at run time and does not read
; it; `pio run -e esp32c3 --target upload` does, so check `pio device list`
; before using this environment directly.
[env:esp32c3]
extends = esp32c3_client
build_flags =
    ${esp32c3_client.build_flags}
    -DROOM_NAME='"SonoLoco-C3"'
upload_port = COM10
monitor_port = COM10
