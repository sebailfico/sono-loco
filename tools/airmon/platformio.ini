; SonoLoco air monitor -- a standalone sniffer for a spare classic ESP32.
; Not part of the product firmware (see ../../esp32-code); it is a bench
; instrument, so it lives with the other bench tools. Build and flash from
; this directory: `pio run -t upload --upload-port COMx`.
[env:airmon]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
